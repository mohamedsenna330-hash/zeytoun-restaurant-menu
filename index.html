<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator - Sheraton A</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; padding: 20px; text-align: center; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; width: 180px; color: black; }
        .card h3 { margin: 10px 0; font-size: 16px; }
        canvas, img { margin: 0 auto; }
    </style>
</head>
<body>

    <h2 style="color: #d4af37;">Sheraton Point A - QR Codes</h2>
    <p>Generating Umbrellas 1 to 25...</p>
    
    <div class="grid" id="qr-container"></div>

    <!-- مكتبة توليد الباركود -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        const baseUrl = "https://mohamedsenna330-hash.github.io/zeytouna-menu/";
        const pointName = "sheraton-a";
        const container = document.getElementById('qr-container');

        for (let i = 1; i <= 25; i++) {
            const link = ${baseUrl}?point=${pointName}#s${i};
            
            const card = document.createElement('div');
            card.className = 'card';
            
            const title = document.createElement('h3');
            title.innerText = Sheraton A\nUmbrella ${i};
            title.style.whiteSpace = "pre-line";
            
            const qrDiv = document.createElement('div');
            qrDiv.id = qr-${i};
            
            card.appendChild(title);
            card.appendChild(qrDiv);
            container.appendChild(card);

            new QRCode(qrDiv, {
                text: link,
                width: 150,
                height: 150,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
